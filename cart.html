<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة التسوق - LYORA FRAGRANCE</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 font-sans">

<div class="max-w-3xl mx-auto p-4">
  <a href="index.html" class="inline-block text-gray-700 hover:text-gray-900 mb-6 font-semibold">
    ⬅️ العودة للمتجر
  </a>

  <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">سلة التسوق</h1>

  <!-- ===== عرض عناصر السلة ===== -->
  <div id="items" class="space-y-3 mb-6"></div>

  <!-- ===== نموذج معلومات العميل ===== -->
  <div class="bg-white p-6 rounded-xl shadow space-y-4">
    <input id="name" placeholder="الاسم الكامل" class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-yellow-500">
    <input id="phone" placeholder="رقم الهاتف" class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-yellow-500">
    <textarea id="address" placeholder="العنوان الكامل" class="w-full border border-gray-300 p-3 rounded focus:ring-2 focus:ring-yellow-500"></textarea>

    <div class="p-3 border border-gray-300 rounded text-green-700 font-semibold">
      🚚 التوصيل: مجاني
    </div>
  </div>

  <!-- ===== إجمالي الطلب + زر WhatsApp ===== -->
  <div class="mt-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div id="total" class="text-xl font-bold text-gray-800">الإجمالي: 0DH</div>
    <button onclick="checkout()"
      class="w-full sm:w-auto bg-yellow-500 hover:bg-yellow-600 text-white py-3 px-6 rounded-xl font-bold transition shadow-lg">
      إتمام الشراء عبر WhatsApp
    </button>
  </div>
</div>

<script>
// ===== استدعاء السلة من LocalStorage =====
let cart = JSON.parse(localStorage.getItem("cart")) || [];
const items = document.getElementById("items");
const totalDiv = document.getElementById("total");

// ===== عرض السلة =====
function render() {
  if(cart.length === 0){
    items.innerHTML = `<p class="text-center text-gray-500 text-lg">السلة فارغة</p>`;
    totalDiv.textContent = "الإجمالي: 0DH";
    return;
  }

  let html = "";
  let total = 0;

  cart.forEach((c, index) => {
    html += `
      <div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
        <div class="flex items-center gap-4">
          <img src="${c.image || 'images/perfume.jpg'}" class="w-20 h-20 object-cover rounded-lg">
          <div>
            <h3 class="font-bold text-gray-800">${c.name}</h3>
            <p class="text-gray-600">${c.price} DH × ${c.quantity}</p>
          </div>
        </div>
        <div class="flex flex-col items-end gap-2">
          <div class="font-semibold text-gray-800">${c.price * c.quantity} DH</div>
          <button onclick="removeItem(${index})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded transition">
            إزالة
          </button>
        </div>
      </div>
    `;
    total += c.price * c.quantity;
  });

  items.innerHTML = html;
  totalDiv.textContent = `الإجمالي: ${total}DH`;
}

// ===== إزالة منتج من السلة =====
function removeItem(index){
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  render();
}

// ===== Checkout عبر WhatsApp =====
function checkout() {
  const nameEl = document.getElementById("name");
  const phoneEl = document.getElementById("phone");
  const addressEl = document.getElementById("address");

  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();
  const address = addressEl.value.trim();

  if(!name || !phone || !address){
    return alert("يرجى تعبئة جميع الحقول 🔴");
  }

  if(cart.length === 0){
    return alert("السلة فارغة 🛒");
  }

  let total = 0;
  let msg = `🛍️ طلب جديد%0A👤 الاسم: ${name}%0A📞 الهاتف: ${phone}%0A📍 العنوان: ${address}%0A🚚 التوصيل: مجاني%0A`;

  cart.forEach(c => {
    msg += `• ${c.name} x${c.quantity}%0A`;
    total += c.price * c.quantity;
  });

  msg += `💰 المجموع الكلي: ${total}DH`;

  // حفظ الطلب للـ Dashboard
  const orders = JSON.parse(localStorage.getItem("orders")) || [];
  orders.push({name, phone, address, cart, total: total, date: new Date().toLocaleString()});
  localStorage.setItem("orders", JSON.stringify(orders));

  // فتح WhatsApp مع الرسالة
  window.open(`https://wa.me/212693268013?text=${msg}`, "_blank");

  // مسح السلة بعد الإرسال
  localStorage.removeItem("cart");
  render();
}

// عرض السلة عند التحميل
render();
</script>

</body>
</html>
