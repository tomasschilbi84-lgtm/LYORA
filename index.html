<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYORA FRAGRANCE</title>

<script src="https://cdn.tailwindcss.com"></script>
<style>
  .filter-btn{
    border:1px solid black;
    padding:8px 18px;
    border-radius:999px;
    font-weight:bold;
    transition:0.3s;
  }
  .filter-btn:hover{
    background:black;
    color:white;
  }
</style>
</head>

<body class="bg-white text-black font-sans">

<!-- ===== LOGO ===== -->
<div class="flex justify-center py-8">
  <img src="images/logo.png" alt="LYORA" class="w-[260px] md:w-[320px]">
</div>

<!-- ===== HERO IMAGE ===== -->
<div class="w-full">
  <img src="images/hero.jpg" class="w-full h-[340px] md:h-[550px] object-cover">
</div>

<!-- ===== FILTER ===== -->
<div class="flex justify-center gap-3 mt-10">
  <button onclick="filterProducts('all')" class="filter-btn">الكل</button>
  <button onclick="filterProducts('men')" class="filter-btn">رجالي</button>
  <button onclick="filterProducts('women')" class="filter-btn">نسائي</button>
</div>

<!-- ===== PRODUCTS ===== -->
<div id="products"
class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5 p-5 mt-8 max-w-7xl mx-auto">
</div>

<!-- ===== CART BUTTON ===== -->
<a href="cart.html"
class="fixed bottom-6 left-6 bg-black text-white px-6 py-3 rounded-full shadow-lg text-lg">
🛒 السلة
</a>

<script>
const PRICE = 49;

// جميع المنتجات مع صور حقيقية
const products = [
 {name:"9PM", cat:"men", img:"images/9pm.jfif"},
 {name:"Khamrah", cat:"women", img:"images/latafa.jfif"},
 {name:"Kilian Paris", cat:"women", img:"images/Kilian Paris.jfif"},
 {name:"Amber Musk", cat:"men", img:"images/Amber Musk.jfif"},
 {name:"1 Million", cat:"men", img:"images/milion.jfif"},
 {name:"Good Girl", cat:"women", img:"images/goodgirl.jpg"},
 {name:"Libre", cat:"women", img:"images/libre.jpg"},
 {name:"Sauvage", cat:"men", img:"images/sauvage.jpg"},
 {name:"Bleu De Chanel", cat:"men", img:"images/bleu.jpg"},
 {name:"YSL Y", cat:"men", img:"images/ysly.jpg"},
 {name:"Black Opium", cat:"women", img:"images/blackopium.jpg"},
 {name:"Scandal", cat:"women", img:"images/scandal.jpg"},
 {name:"Oud Wood", cat:"men", img:"images/oudwood.jpg"},
 {name:"Stronger With You", cat:"men", img:"images/stronger with you.jfif"},
 {name:"La Vie Est Belle", cat:"women", img:"images/lavie.jpg"},
 {name:"Chance Chanel", cat:"women", img:"images/chance.jpg"},
 {name:"Invictus", cat:"men", img:"images/invictus.jpg"},
 {name:"Alien", cat:"women", img:"images/alien.jpg"},
 {name:"Eros Versace", cat:"men", img:"images/eros.jpg"},
 {name:"CK One", cat:"men", img:"images/ckone.jpg"}
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];
const container = document.getElementById("products");

// عرض المنتجات
function renderProducts(list){
  container.innerHTML="";
  list.forEach(p=>{
    container.innerHTML += `
    <div class="border rounded-2xl overflow-hidden hover:shadow-xl transition bg-white">
      <img src="${p.img}" class="w-full h-44 object-cover">
      <div class="p-4 text-center">
        <h3 class="font-bold text-lg">${p.name}</h3>
        <p class="font-semibold mt-1">${PRICE} DH</p>
        <button onclick="addToCart('${p.name}')"
        class="bg-black text-white w-full py-2 mt-3 rounded-xl hover:bg-gray-800 transition">
          أضف إلى السلة
        </button>
      </div>
    </div>`;
  });
}

// فلترة المنتجات
function filterProducts(type){
  if(type === "all") renderProducts(products);
  else renderProducts(products.filter(p => p.cat === type));
}

// إضافة إلى السلة
function addToCart(name){
  const item = cart.find(i => i.name === name);
  if(item) item.quantity++;
  else cart.push({name:name, price:PRICE, quantity:1});
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("تمت الإضافة إلى السلة 🛒");
}

// عرض جميع المنتجات عند التحميل
renderProducts(products);
</script>

</body>
</html>
