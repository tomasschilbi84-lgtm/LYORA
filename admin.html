<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-3xl font-bold mb-6">📦 الطلبات</h1>

<div id="orders"></div>

<script>
const orders = JSON.parse(localStorage.getItem("orders")) || [];
const container = document.getElementById("orders");

if(orders.length === 0){
  container.innerHTML = "<p>لا توجد طلبات</p>";
}

orders.forEach((o,i)=>{
  const div = document.createElement("div");
  div.className="bg-white p-4 rounded shadow mb-4";
  div.innerHTML=`
    <h3 class="font-bold">${o.name}</h3>
    <p>📞 ${o.phone}</p>
    <p>📍 ${o.address}</p>
    <p>🕒 ${o.date}</p>
    <ul class="list-disc mr-6 mt-2">
      ${o.cart.map(p=>`<li>${p.name} x${p.quantity}</li>`).join("")}
    </ul>
    <p class="font-bold mt-2">💰 ${o.total} DH</p>
  `;
  container.appendChild(div);
});
</script>

</body>
</html>
